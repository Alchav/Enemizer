[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enemizer-py"
version = "0.1.0"
description = "Python port scaffold for Enemizer CLI"
requires-python = ">=3.10"

[project.scripts]
enemizer-py = "enemizer_py.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
